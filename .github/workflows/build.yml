name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег выпуска, например v0.1.0 (пусто — просто собрать)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official
            index: https://update.flipperzero.one/firmware/directory.json
          - name: unleashed
            index: https://up.unleashedflip.com/directory.json
          - name: momentum
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - uses: actions/checkout@v4

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: release
          sdk-index-url: ${{ matrix.index }}

      - name: Rename package
        run: |
          mkdir -p out
          cp "${{ steps.build.outputs.fap-dir }}/rj45_tester.fap" "out/rj45_tester-${{ matrix.name }}.fap"
          echo "API ${{ steps.build.outputs.api-version }}, SDK ${{ steps.build.outputs.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rj45_tester-${{ matrix.name }}
          path: out/rj45_tester-${{ matrix.name }}.fap

      - name: Keep package for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out/*.fap
          retention-days: 1

  release:
    name: Publish release
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref_type == 'tag' ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          ls -l out
          TAG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$RELEASE_TAG" ]; then
            # выпуск из панели Actions: тег создаётся на собранном коммите
            TAG="$RELEASE_TAG"
          fi
          if [ -n "$TAG" ]; then
            NOTES="release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" out/*.fap --repo "$REPO" --title "$TAG" --notes-file "$NOTES" --latest \
                --target "${{ github.sha }}"
            else
              gh release create "$TAG" out/*.fap --repo "$REPO" --title "$TAG" --latest \
                --target "${{ github.sha }}" --notes "Сборка $TAG. Какой файл ставить — см. README."
            fi
          else
            # «latest» — свежая сборка последнего коммита основной ветки
            gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
            gh release create latest out/*.fap --repo "$REPO" --prerelease \
              --target "${{ github.sha }}" --title "Свежая сборка (${GITHUB_SHA::7})" \
              --notes "Собрано автоматически из ${{ github.sha }}. Какой файл ставить — см. README."
          fi
